name: Bug report
description: Report a reproducible QuackQuota problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      description: Please search open and closed issues before filing a new one.
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Give a short summary of the observed problem.
      placeholder: QuackQuota shows...
    validations:
      required: true

  - type: textarea
    id: actual-result
    attributes:
      label: Actual result
      description: What did the app do?
      placeholder: Describe the observed behavior without credentials or private paths.
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected result
      description: What did you expect to happen instead?
      placeholder: Describe the expected behavior.
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Does it reproduce consistently?
      options:
        - Every time
        - Sometimes
        - Only once
        - I have not tried again
    validations:
      required: true

  - type: checkboxes
    id: affected-area
    attributes:
      label: Affected area
      description: Select every surface that seems relevant.
      options:
        - label: QuackQuota overlay
        - label: Settings UI
        - label: Config file / settings persistence
        - label: App Server or Legacy quota path
        - label: Proxy or network behavior
        - label: Startup, tray, or window behavior
        - label: Other

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction you know.
      placeholder: |
        1. Open...
        2. Click...
        3. See...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or recordings
      description: Add redacted logs or screenshots if relevant. Do not paste tokens, cookies, API keys, auth.json content, complete logs, or private account details.
      render: text

  - type: input
    id: version
    attributes:
      label: App version
      description: Version, commit, or installer used.
      placeholder: commit or future release version

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2

  - type: input
    id: codex-cli-version
    attributes:
      label: Codex CLI version

  - type: input
    id: display-setup
    attributes:
      label: DPI and display count
      placeholder: 125%, two displays

  - type: dropdown
    id: quota-source
    attributes:
      label: Quota source
      options:
        - App Server
        - Legacy fallback
        - Unknown

  - type: dropdown
    id: proxy-mode
    attributes:
      label: Proxy mode
      options:
        - Direct
        - Environment proxy
        - Manual proxy
        - Unknown

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that would help debug the issue.
